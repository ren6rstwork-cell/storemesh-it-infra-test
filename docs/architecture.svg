<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#f8fafc"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    System Architecture — Web App Environment (Docker Compose)
  </text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#64748b">
    Digital Storemesh Co., Ltd. — IT Infrastructure Developer Qualification Test
  </text>

  <!-- Client -->
  <rect x="410" y="80" width="160" height="56" rx="10" fill="#0f172a"/>
  <text x="490" y="104" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Client Browser</text>
  <text x="490" y="122" text-anchor="middle" font-size="11" fill="#94a3b8">User (public internet)</text>

  <!-- Host port -->
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#334155">HTTP :80</text>

  <!-- Docker network boundary -->
  <rect x="60" y="168" width="860" height="430" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="82" y="192" font-size="12" font-weight="700" fill="#4338ca">Docker network: storemesh-net (docker-compose.yml)</text>

  <!-- Nginx -->
  <rect x="410" y="210" width="160" height="70" rx="10" fill="#0369a1"/>
  <text x="490" y="240" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">Nginx</text>
  <text x="490" y="257" text-anchor="middle" font-size="10.5" fill="#e0f2fe">reverse proxy · container "nginx"</text>
  <text x="490" y="271" text-anchor="middle" font-size="10" fill="#bae6fd">published port 80:80</text>

  <!-- routing labels -->
  <text x="290" y="308" text-anchor="middle" font-size="10.5" fill="#334155">/  (everything else)</text>
  <text x="700" y="308" text-anchor="middle" font-size="10.5" fill="#334155">/api/*  /admin/*  /static/*</text>

  <!-- Frontend -->
  <rect x="150" y="330" width="220" height="80" rx="10" fill="#0891b2"/>
  <text x="260" y="358" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">React.js Frontend</text>
  <text x="260" y="375" text-anchor="middle" font-size="10.5" fill="#cffafe">container "frontend" · Vite build</text>
  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#a5f3fc">served by internal Nginx :80 (SPA)</text>

  <!-- Backend -->
  <rect x="610" y="330" width="220" height="80" rx="10" fill="#15803d"/>
  <text x="720" y="358" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">Django Backend</text>
  <text x="720" y="375" text-anchor="middle" font-size="10.5" fill="#dcfce7">container "backend" · Django 4.2 REST API</text>
  <text x="720" y="390" text-anchor="middle" font-size="10" fill="#bbf7d0">gunicorn :8000 (internal only)</text>

  <!-- Database -->
  <rect x="610" y="470" width="220" height="80" rx="10" fill="#7c3aed"/>
  <text x="720" y="498" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">PostgreSQL 15.2</text>
  <text x="720" y="515" text-anchor="middle" font-size="10.5" fill="#ede9fe">container "db"</text>
  <text x="720" y="530" text-anchor="middle" font-size="10" fill="#ddd6fe">:5432 · volume: postgres_data</text>

  <!-- Static volume note -->
  <rect x="150" y="470" width="220" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="260" y="498" text-anchor="middle" font-size="12" fill="#334155" font-weight="700">static_data volume</text>
  <text x="260" y="515" text-anchor="middle" font-size="10" fill="#475569">collectstatic output</text>
  <text x="260" y="530" text-anchor="middle" font-size="10" fill="#475569">mounted read-only into nginx</text>

  <!-- External API (optional) -->
  <rect x="770" y="580" width="1" height="1" fill="none"/>

  <!-- Arrows -->
  <line x1="490" y1="136" x2="490" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="440" y1="280" x2="270" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="280" x2="710" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="720" y1="410" x2="720" y2="468" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="740" y="443" font-size="10.5" fill="#0369a1">SQL over TCP</text>

  <line x1="610" y1="365" x2="480" y2="365" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3,3"/>
  <line x1="370" y1="510" x2="608" y2="380" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="470" y="450" font-size="10" fill="#64748b">collectstatic writes here on startup</text>

  <!-- Legend -->
  <rect x="82" y="580" width="14" height="14" fill="#0369a1"/>
  <text x="102" y="592" font-size="10.5" fill="#334155">Reverse proxy (single public entrypoint, port 80)</text>

  <rect x="420" y="580" width="14" height="14" fill="#15803d"/>
  <text x="440" y="592" font-size="10.5" fill="#334155">Internal-only services (no published port)</text>

  <rect x="700" y="580" width="14" height="14" fill="#7c3aed"/>
  <text x="720" y="592" font-size="10.5" fill="#334155">Data layer</text>

  <text x="82" y="616" font-size="10.5" fill="#64748b">
    Data flow: Browser ⇄ Nginx (:80) ⇄ [React static files | Django REST API :8000] ⇄ PostgreSQL (:5432, internal network only)
  </text>
</svg>
