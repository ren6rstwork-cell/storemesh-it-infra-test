# Storemesh IT Infra Test - reverse proxy configuration
#
# This is the single entrypoint for the whole stack (port 80). It routes:
#   /api/*  and /admin/*  -> Django backend  (service: backend:8000)
#   everything else       -> React frontend  (service: frontend:80)
#
# Rationale: the browser only ever talks to Nginx. Nginx decides, based on
# the URL path, whether a request is for the API or for the SPA's static
# assets, and forwards it to the right upstream container over the
# Docker-internal network. Neither backend nor frontend need to be
# reachable directly from outside the Docker network.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded DNS resolver. Combined with using *variables* in
    # proxy_pass below (instead of a static `upstream {}` block), this
    # makes Nginx resolve backend/frontend hostnames lazily, at request
    # time, rather than once when Nginx starts. That matters because
    # Nginx starts fast and would otherwise fail to boot ("host not found
    # in upstream") if it comes up before the backend/frontend containers
    # have finished initializing, and it lets Nginx pick up a new
    # container IP automatically after a restart.
    resolver 127.0.0.11 valid=30s;

    # Basic request logging so `docker compose logs nginx` shows traffic
    # flowing to each upstream while debugging.
    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" -> $upstream_addr';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        set $backend_upstream backend:8000;
        set $frontend_upstream frontend:80;

        # --- Django admin ---------------------------------------------
        location /admin/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Django REST API --------------------------------------------
        # Data flow: browser -> Nginx (/api/...) -> Django (backend:8000)
        # -> PostgreSQL (db:5432, not exposed to Nginx or the browser).
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Django static files (admin CSS/JS, DRF browsable API assets).
        # Served directly by Nginx from the shared `static_data` volume
        # (populated by `collectstatic` in the backend entrypoint) rather
        # than proxied to gunicorn -- faster, and gunicorn doesn't serve
        # static files itself when DEBUG=False.
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- React.js frontend (everything else) ------------------------
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
