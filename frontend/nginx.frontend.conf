# Serves the built React (Vite) single-page app from this container.
# The *outer* reverse-proxy Nginx (see /nginx/nginx.conf at the repo root)
# is what the browser actually talks to; it forwards frontend requests
# here and API requests to the Django backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: any path that isn't a real file goes to index.html
        # so React Router / client-side navigation keeps working.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
