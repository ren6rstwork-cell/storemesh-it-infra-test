name: storemesh-it-infra

services:
  # --- PostgreSQL 15.2 ---------------------------------------------------
  db:
    image: postgres:15.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storemesh}
      POSTGRES_USER: ${POSTGRES_USER:-storemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storemesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed to the host only for local debugging (psql, DB GUI tools).
      # Nginx/backend reach this over the internal Docker network, not
      # through this published port.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storemesh} -d ${POSTGRES_DB:-storemesh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storemesh-net

  # --- Django 4.2 backend --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storemesh}
      POSTGRES_USER: ${POSTGRES_USER:-storemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storemesh}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    expose:
      - "8000"
    networks:
      - storemesh-net

  # --- React.js frontend (built + served by its own Nginx) ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - storemesh-net

  # --- Nginx reverse proxy (single public entrypoint) ---------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - storemesh-net

networks:
  storemesh-net:
    driver: bridge

volumes:
  postgres_data:
  static_data:
